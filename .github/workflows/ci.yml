name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Reuse the committed dependency pins for xcodebuild's SPM resolution.
          mkdir -p whisp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved whisp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build (smoke check)
        run: |
          xcodebuild -project whisp.xcodeproj \
            -scheme whisp \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG LOCAL_BUILD" \
            build 2>&1 | grep -E "error:|warning:|BUILD SUCCEEDED|BUILD FAILED" | tail -5

      - name: Run tests
        run: swift test --no-parallel
