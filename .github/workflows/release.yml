name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v0.1.1-private. Defaults to current ref name.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-dmg:
    name: Build unsigned DMG + Sparkle appcast
    # macOS 26 image ships Xcode 26 — required to compile the app's macOS 26 APIs
    # (SpeechAnalyzer/SpeechTranscriber, etc.). The macos-15 image's SDK is too old → xcodebuild 65.
    runs-on: macos-26

    env:
      SPARKLE_VERSION: 2.9.2
      # SHA256 of Sparkle-2.9.2.tar.xz — update together with SPARKLE_VERSION.
      SPARKLE_TOOLS_SHA256: 1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95
      SPARKLE_FEED_URL: https://github.com/slava-makeenko/whisp/releases/latest/download/appcast.xml
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      # SPARKLE_PRIVATE_ED_KEY is deliberately NOT job-level env: it must stay
      # invisible to third-party action steps. Only the two steps below get it.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate Sparkle secrets
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY" || { echo "Missing SPARKLE_PUBLIC_ED_KEY secret"; exit 1; }
          test -n "$SPARKLE_PRIVATE_ED_KEY" || { echo "Missing SPARKLE_PRIVATE_ED_KEY secret"; exit 1; }

      - name: Resolve release version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BUILD_NUMBER=$(VERSION="$VERSION" python3 -c 'import os; parts=[int(p) for p in os.environ["VERSION"].split(".")]; print(parts[0]*10000 + parts[1]*100 + parts[2])')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "DMG_NAME=whisp-${VERSION}.dmg" >> "$GITHUB_ENV"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Sparkle tools
        run: |
          curl -L -o Sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_TOOLS_SHA256}  Sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf Sparkle.tar.xz
          test -x bin/generate_appcast

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Reuse the committed dependency pins for xcodebuild's SPM resolution.
          mkdir -p whisp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved whisp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build Release with Sparkle enabled
        run: |
          xcodebuild -project whisp.xcodeproj \
            -scheme whisp \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build

      - name: Package DMG
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name whisp.app \
            -path '*/Build/Products/Release/*' | grep -v Index.noindex | head -1)
          test -n "$APP" || { echo "whisp.app not found"; exit 1; }
          echo "Packaging: $APP"

          # Private builds are not Developer ID signed/notarized, but Sparkle's
          # appcast generator still expects the bundle to have a valid Apple code
          # signature. Use ad-hoc signing for this private distribution path.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/whisp.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "whisp" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            -o "$DMG_NAME"

          hdiutil verify "$DMG_NAME"
          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          ARCHIVE_DIR=$(mktemp -d)
          cp "$DMG_PATH" "$ARCHIVE_DIR/$DMG_NAME"
          KEY_FILE=$(mktemp)
          # GitHub Secrets are easy to paste with a trailing newline/space; Sparkle
          # expects raw base64 with no surrounding whitespace.
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | tr -d '[:space:]' > "$KEY_FILE"
          export KEY_FILE
          python3 -c "import base64, os, pathlib, sys; s=pathlib.Path(os.environ['KEY_FILE']).read_text().strip(); raw=base64.b64decode(s, validate=True); print(f'SPARKLE_PRIVATE_ED_KEY looks base64: chars={len(s)}, decoded_bytes={len(raw)}'); sys.exit(0 if len(raw) in (32, 96) else 1)"
          ./bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/slava-makeenko/whisp/releases/download/$TAG/" \
            "$ARCHIVE_DIR"
          cp "$ARCHIVE_DIR/appcast.xml" ./appcast.xml
          test -s appcast.xml
          grep -q 'sparkle:edSignature' appcast.xml
          echo "APPCAST_PATH=appcast.xml" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: whisp ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.APPCAST_PATH }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `whisp-${{ env.VERSION }}.dmg` below.
            2. Open the DMG and drag **whisp** to **Applications**.
            3. On first launch right-click → **Open** to bypass Gatekeeper
               (this build is unsigned and not notarized).
            4. Grant **Microphone** and **Accessibility** when prompted.

            ## Updates

            Sparkle is enabled in this build. The app checks:

            `${{ env.SPARKLE_FEED_URL }}`

            The appcast and DMG are EdDSA-signed with Sparkle, but the macOS app
            itself is intentionally unsigned/not notarized for this private build.
