# XcodeGen spec for the .app shell. Regenerate with: xcodegen generate
# The shell is intentionally thin — all logic lives in the SPM package (path: ".").
name: whisp
options:
  bundleIdPrefix: com.slavamakeenko
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "401"
    DEVELOPMENT_TEAM: ""               # P5
packages:
  Whisp:
    path: "."
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Pinned exactly: Sparkle is outside Package.resolved (Xcode-level package),
    # and the version must match SPARKLE_VERSION in .github/workflows/release.yml.
    exactVersion: "2.9.2"
targets:
  whisp:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      - App/Resources/Localizable.xcstrings
      - path: App/Resources/Fonts
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slavamakeenko.whisp
        PRODUCT_NAME: whisp
        SPARKLE_FEED_URL: https://github.com/slava-makeenko/whisp/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/whisp.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        # Non-sandboxed Developer ID build (CGEventTap + AX + private MediaRemote require it).
      configs:
        # Debug runs without CloudKit/Sparkle (no P3/P4 needed) via the LOCAL_BUILD flag.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LOCAL_BUILD"
    dependencies:
      - package: Whisp
        product: WhispCore
      - package: Whisp
        product: WhispAudio
      - package: Whisp
        product: WhispASR
      - package: Whisp
        product: WhispInput
      - package: Whisp
        product: WhispPlatform
      - package: Whisp
        product: WhispLLM
      - package: Sparkle
        product: Sparkle
